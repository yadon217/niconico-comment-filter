<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>ニコニコ コメントフィルター</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>ニコニコ コメントフィルター</h1>
    <label class="row">
      <span>フィルター</span>
      <input id="enabled" type="checkbox" />
    </label>
    <p id="page-note" class="note" hidden>このページでは動作しません</p>
    <p id="status" class="note" hidden></p>
    <section>
      <h2>この動画で非表示</h2>
      <p id="total">0件</p>
      <ul id="breakdown"></ul>
    </section>
    <label class="row">
      <span>NG理由を表示</span>
      <input id="debug" type="checkbox" />
    </label>
    <button id="options" type="button">詳細設定</button>
    <script type="module" src="popup.js"></script>
  </body>
</html>
