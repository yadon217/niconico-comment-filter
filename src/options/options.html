<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>ニコニコ コメントフィルター — 詳細設定</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <h1>詳細設定</h1>

    <section>
      <h2>基本</h2>
      <label><input id="enabled" type="checkbox" /> フィルターを有効</label>
      <label><input id="debug" type="checkbox" /> デバッグ表示</label>
      <label><input id="lengthEnabled" type="checkbox" /> 長文NG</label>
      <label>文字数しきい値 <input id="maxLength" type="number" min="1" /></label>
    </section>

    <section>
      <h2>NGワード</h2>
      <form id="keyword-form">
        <input id="keyword-value" placeholder="ワード" required />
        <select id="keyword-mode">
          <option value="contains">部分一致</option>
          <option value="exact">完全一致</option>
          <option value="regex">正規表現</option>
        </select>
        <button type="submit">追加</button>
      </form>
      <p id="keyword-error" class="error" hidden></p>
      <table>
        <thead>
          <tr>
            <th>有効</th>
            <th>ワード</th>
            <th>方式</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="keyword-rows"></tbody>
      </table>
    </section>

    <section>
      <h2>NGユーザー</h2>
      <p class="hint">
        ニコニコ内部のユーザー ID（API の userId）です。表示名・@ハンドルではありません。視聴ページのコメントリストを右クリックして ID
        をコピーするか、ここに貼り付けて追加できます。
      </p>
      <form id="user-form">
        <input id="user-id" placeholder="ユーザー ID" required />
        <button type="submit">追加</button>
      </form>
      <p id="user-error" class="error" hidden></p>
      <table>
        <thead>
          <tr>
            <th>有効</th>
            <th>ユーザー ID</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="user-rows"></tbody>
      </table>
    </section>

    <section>
      <h2>コメント種別</h2>
      <p class="hint">色・サイズ・位置で非表示にします（NGワード等とは別に判定）。</p>
      <label><input id="style-enabled" type="checkbox" /> 種別フィルターを有効</label>
      <fieldset>
        <legend>非表示にする種別</legend>
        <label><input id="style-color" type="checkbox" /> 色付き（デフォルトの白以外）</label>
        <label><input id="style-big" type="checkbox" /> 大きい（big）</label>
        <label><input id="style-small" type="checkbox" /> 小さい（small）</label>
        <label><input id="style-ue" type="checkbox" /> 上固定（ue）</label>
        <label><input id="style-shita" type="checkbox" /> 下固定（shita）</label>
        <label><input id="style-naka" type="checkbox" /> 流れコメント（naka）</label>
      </fieldset>
      <label>
        種別の結合（チェックした条件）
        <select id="style-rule-combinator">
          <option value="or">いずれか一致で非表示（OR）</option>
          <option value="and">すべて一致で非表示（AND）</option>
        </select>
      </label>
    </section>

    <section>
      <h2>バックアップ</h2>
      <button id="export" type="button">JSONエクスポート</button>
      <label>JSONインポート（全置換）<input id="import" type="file" accept="application/json,.json" /></label>
      <p id="import-error" class="error" hidden></p>
    </section>

    <script type="module" src="options.js"></script>
  </body>
</html>
